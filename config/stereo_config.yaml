fringe_capture:
  camera_resolution:
    height: 2048
    width: 2448
  n_steps: 8
  output_dir: /home/jetson/active_results
  pixels_per_fringe: 64
  projector_display_ms: 50
  projector_monitor_name: DP-1
  projector_resolution:
    height: 1080
    width: 1920
  projector_window_name: Projector
  save_raw_frames: true
  zncc:
    num_images: 5
    warmup_triggers: 0
stereo_system:
  acquisition:
    buffer_handling_mode: NewestOnly
    pixel_format: Mono8
    timeout_ms: 1000
  gpio_trigger:
    active_low: false
    enabled: true
    jetson_model: ORIN_AGX_PIN_MAP
    pin_type: LINUX_GPIO_NUM
    pins:
    - 85
    pulse_duration_us: 100
  left_camera:
    auto_exposure: false
    auto_gain: false
    exposure_time_us: 8000.0
    gain_db: 0.0
    serial_number: '26203022'
    trigger:
      activation: RisingEdge
      delay_us: 0.0
      mode: true
      overlap: ReadOut
      selector: FrameStart
      source: Line2
  right_camera:
    auto_exposure: false
    auto_gain: false
    exposure_time_us: 8000.0
    gain_db: 0.0
    serial_number: '26203023'
    trigger:
      activation: RisingEdge
      delay_us: 0.0
      mode: true
      overlap: ReadOut
      selector: FrameStart
      source: Line2
  zncc:
    num_images: 5
    warmup_triggers: 0
    delay_us: 3000
    laser_pin: 106
    pwm_chip_a: "/sys/class/pwm/pwmchip3"
    pwm_chip_b: "/sys/class/pwm/pwmchip2"
    pwm_channel: 0
    pwm_frequency_hz: 1000.0
    pwm_duty_percent: 0.0
  encoder:
    pin_type: HEADER_PIN
    jetson_model: JETSON_AGX_ORIN
    pins:
    - 11
    - 12
    pulses_per_rev: 2100